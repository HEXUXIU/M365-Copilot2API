services:
  m365-copilot2api:
    build: .
    image: m365-copilot2api:latest
    container_name: m365-copilot2api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4141:4141"
    environment:
      M365_LISTEN: 0.0.0.0:4141
      M365_DATA_DIR: /data
      M365_CONFIG: /data/accounts.json
      M365_TOKEN_CACHE: /data/token-cache.json
      M365_SESSION_CACHE: /data/sessions.json
      M365_API_KEYS: /data/api-keys.json
      M365_ADMIN_PASSWORD_FILE: /data/admin-password
      M365_ADMIN_PASSWORD_BOOTSTRAP_FILE: /run/secrets/m365_admin_password
      M365_ACCOUNT_CONCURRENCY_LIMIT: "${M365_ACCOUNT_CONCURRENCY_LIMIT:-256}"
      M365_ACCOUNT_DEFAULT_CONCURRENCY: "${M365_ACCOUNT_DEFAULT_CONCURRENCY:-256}"
      M365_CHAT_TIMEOUT_SECONDS: "120"
      M365_IMAGE_TIMEOUT_SECONDS: "150"
      M365_AFFINITY_MODE: "${M365_AFFINITY_MODE:-off}"
      M365_CACHE_STRATEGY: "${M365_CACHE_STRATEGY:-balanced}"
      M365_STICKY_FULL_CONTEXT: "${M365_STICKY_FULL_CONTEXT:-true}"
      M365_STICKY_ACCOUNT_CONCURRENCY: "${M365_STICKY_ACCOUNT_CONCURRENCY:-256}"
      M365_AFFINITY_REUSE_ROUTER_CONVERSATION: "${M365_AFFINITY_REUSE_ROUTER_CONVERSATION:-false}"
      M365_AFFINITY_TTL_MINUTES: "${M365_AFFINITY_TTL_MINUTES:-30}"
      M365_AFFINITY_MAX_SESSIONS: "${M365_AFFINITY_MAX_SESSIONS:-10000}"
      M365_SESSION_LOCK_TTL_SECONDS: "${M365_SESSION_LOCK_TTL_SECONDS:-180}"
      M365_SESSION_LOCK_WAIT_SECONDS: "${M365_SESSION_LOCK_WAIT_SECONDS:-120}"
      M365_STICKY_RETRY_AFTER_SECONDS: "${M365_STICKY_RETRY_AFTER_SECONDS:-5}"
      M365_AFFINITY_ANONYMOUS_SCOPE: "${M365_AFFINITY_ANONYMOUS_SCOPE:-ip}"
      M365_REDIS_URL: "${M365_REDIS_URL:-}"
      M365_REDIS_POOL_SIZE: "${M365_REDIS_POOL_SIZE:-256}"
      M365_WS_POOL_SIZE: "${M365_WS_POOL_SIZE:-4}"
      M365_WS_POOL_TTL_SECONDS: "${M365_WS_POOL_TTL_SECONDS:-120}"
      M365_TRANSIENT_RETRY_ATTEMPTS: "${M365_TRANSIENT_RETRY_ATTEMPTS:-2}"
      M365_TRANSIENT_RETRY_DELAY_MS: "${M365_TRANSIENT_RETRY_DELAY_MS:-100}"
      M365_TOKEN_PRE_REFRESH: "true"
      M365_TOKEN_PRE_REFRESH_MINUTES: "5"
      M365_TOKEN_PRE_REFRESH_INTERVAL_SECONDS: "60"
      M365_TOKEN_PRE_REFRESH_CONCURRENCY: "4"
      M365_PROXY_HEALTH_URL: "https://login.microsoftonline.com/common/v2.0/.well-known/openid-configuration"
      M365_PUBLIC_IDENTITY_POLICY: "${M365_PUBLIC_IDENTITY_POLICY:-false}"
      M365_PUBLIC_REASONING_OUTPUT: "${M365_PUBLIC_REASONING_OUTPUT:-false}"
      M365_PUBLIC_REASONING_FILTER: "${M365_PUBLIC_REASONING_FILTER:-false}"
    volumes:
      - ./data:/data
      - ./secrets/m365_admin_password:/run/secrets/m365_admin_password:ro
